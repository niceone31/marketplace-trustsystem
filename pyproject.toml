[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "marketplace-trust-system"
version = "0.1.0"
description = "Review Authenticity & Counterfeit Detection Agent (PS-13)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.2",
    "sentence-transformers>=2.7.0",
    "networkx>=3.3",
    "imagehash>=4.3.1",
    "Pillow>=10.3.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "weasyprint>=61.2",
    "jinja2>=3.1.4",
    "pyarrow>=16.1.0",
    "datasketch>=1.6.5",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.5",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
